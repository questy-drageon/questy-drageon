<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Questy Drageon</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #141414 0%, #000 100%);
      color: #f5f5f5;
      font-family: 'Press Start 2P', cursive;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: #00ffae;
      text-shadow: 0 0 10px #00ffaa;
      margin-bottom: 1rem;
    }

    p {
      font-size: 0.9rem;
      color: #ddd;
      max-width: 500px;
      line-height: 1.6;
    }

    .btn {
      margin-top: 2rem;
      background: #00ffaa;
      color: #000;
      border: none;
      padding: 1rem 2rem;
      font-size: 0.9rem;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.3s;
      text-decoration: none;
    }

    .btn:hover {
      background: #00ffcc;
      box-shadow: 0 0 10px #00ffcc, 0 0 30px #00ffaa;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.6rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Questy Drageon</h1>
  <p>
    Embark on an epic fantasy quest where dragons guard ancient treasures and every
    choice shapes your destiny. Dare to begin the legend?
  </p>
  <a href="#" class="btn">Start Quest</a>

  <footer>© 2025 Questy Drageon — Created by Vhype</footer>
</body>
</html>
